<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <h1 style="font-size: 8em; margin: 0; color: var(--button-bg);">404</h1>
        <h2 style="margin: 20px 0;">Oops:/ Page Not Found</h2>
        <p style="max-width: 600px; margin: 20px auto;">
            The page you're looking for seems to have wandered off into the digital wilderness. 
            Don't worry, we'll get you back on track!
        </p>
        <div class="cta-buttons">
            <a href="/" class="cta-button primary">
                <i class="fas fa-home"></i>
                Go Home
            </a>
            <a href="javascript:history.back()" class="cta-button secondary">
                <i class="fas fa-arrow-left"></i>
                Go Back
            </a>
        </div>
        <p style="margin-top: 40px; color: var(--text-muted);">
            Redirecting to home page in <span id="countdown">10</span> seconds...
        </p>
    </div>
<script src="oneko.js"></script>
    <script>
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');
        
        const countdown = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
